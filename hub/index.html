<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Family OS</title>
<style>
/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%;
  background: #080d08;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  overflow: hidden;
}

/* ── Loading screen ── */
#boot {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: #080d08;
  z-index: 9999;
  transition: opacity 0.6s ease;
}
#boot.fade-out { opacity: 0; pointer-events: none; }

/* ── Main app shell ── */
#app {
  position: fixed; inset: 0;
  display: none;
}
#app.active { display: block; }

/* ── View containers ── */
.view {
  position: absolute; inset: 0;
  display: none;
}
.view.active { display: flex; }
</style>
</head>
<body>

<!-- Boot screen — shown while session check runs -->
<div id="boot">
  <img src="https://olatoyefamily.com/logo.jpg"
       style="width:64px;height:64px;border-radius:14px;object-fit:cover;opacity:0.6;"
       onerror="this.style.display='none'" alt="">
</div>

<!-- Main app shell -->
<div id="app">
  <!-- Views injected by surface.js -->
  <div id="view-pairing" class="view"></div>
  <div id="view-home"    class="view"></div>
</div>

<!-- Supabase JS SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<!-- Family OS Surface identity + app bootstrap -->
<script src="/hub/surface.js"></script>

</body>
</html>
