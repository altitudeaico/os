<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Family OS</title>
<style>
/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%;
  background: #060a06;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  overflow: hidden;
}

/* ── Boot screen ── */
#boot {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: #060a06;
  z-index: 9999;
  transition: opacity 0.6s ease;
}
#boot.fade-out { opacity: 0; pointer-events: none; }

/* ── App shell ── */
#app { position: fixed; inset: 0; display: none; }
#app.active { display: block; }

/* ── View containers ── */
.view { position: absolute; inset: 0; display: none; }
.view.active { display: flex; flex-direction: column; }

/* ══════════════════════════════════════
   PAIRING VIEW
══════════════════════════════════════ */
#view-pairing {
  background: #060a06;
  align-items: center;
  justify-content: center;
}

/* ══════════════════════════════════════
   HOME VIEW — V2 Production
   Full-bleed hero · Large artwork cards
   10-foot TV grammar
══════════════════════════════════════ */
#view-home { background: #060a06; flex-direction: column; }

/* Top chrome */
.home-header {
  position: absolute;
  top: 0; left: 0; right: 0;
  padding: 2.2% 3.5% 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 20;
}
.home-identity { display: flex; align-items: center; gap: 0.6em; }
.home-icon { color: #C9A84C; font-size: 1em; line-height: 1; }
.home-identity-text { display: flex; flex-direction: column; }
.home-nav-label {
  color: rgba(255,255,255,0.4);
  font-size: 0.5em; font-weight: 600;
  letter-spacing: 0.12em; text-transform: uppercase;
  line-height: 1; margin-bottom: 0.2em;
}
.home-wordmark {
  color: #C9A84C;
  font-size: 0.65em; font-weight: 700;
  letter-spacing: 0.14em; text-transform: uppercase;
}
.home-status {
  display: flex; align-items: center; gap: 0.5em;
  background: rgba(0,0,0,0.45);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px; padding: 0.5% 1.2%;
}
.home-status-dot { width: 0.5em; height: 0.5em; border-radius: 50%; background: #30d158; }
.home-status-dot.offline { background: rgba(255,255,255,0.2); }
.home-status-text { color: rgba(255,255,255,0.6); font-size: 0.55em; }
.home-clock {
  color: rgba(255,255,255,0.5);
  font-size: 0.55em; font-variant-numeric: tabular-nums;
  padding-left: 0.8em;
  border-left: 1px solid rgba(255,255,255,0.15);
}

/* Hero — full-bleed */
.home-hero {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 0;
}
.home-hero-bg {
  position: absolute; inset: 0;
  background-size: cover;
  background-position: center top;
  background-repeat: no-repeat;
}
.home-hero-gradient {
  position: absolute; inset: 0;
  background:
    linear-gradient(to right,
      rgba(0,0,0,0.62) 0%,
      rgba(0,0,0,0.2) 45%,
      transparent 70%),
    linear-gradient(to top,
      #060a06 0%,
      rgba(6,10,6,0.97) 18%,
      rgba(6,10,6,0.82) 32%,
      rgba(6,10,6,0.4) 52%,
      rgba(6,10,6,0.1) 68%,
      transparent 85%);
}

/* Hero text */
.home-hero-text {
  position: relative; z-index: 10;
  padding: 0 3.5% 0;
  margin-bottom: 18%;
  max-width: 52%;
}
.hero-context {
  color: #C9A84C;
  font-size: 0.65em; font-weight: 700;
  letter-spacing: 0.14em; text-transform: uppercase;
  margin-bottom: 0.8%;
}
.hero-heading {
  color: #fff;
  font-size: 3.2em; font-weight: 800;
  letter-spacing: -0.03em; line-height: 1.08;
  margin-bottom: 1.2%;
  text-shadow: 0 2px 20px rgba(0,0,0,0.5);
}
.hero-meta { color: rgba(255,255,255,0.5); font-size: 0.75em; }

/* Rail */
.home-rails {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  padding: 0 3.5% 5%;
  display: flex; flex-direction: column;
  z-index: 10;
  background: transparent;
}
.rail-label {
  color: rgba(255,255,255,0.45);
  font-size: 0.58em; font-weight: 700;
  letter-spacing: 0.1em; text-transform: uppercase;
  margin-bottom: 1%;
}
.rail-cards {
  display: flex; gap: 1.4%;
  overflow: visible;
}

/* Cards — large, ~3.5 visible */
.rail-card {
  flex: 0 0 26.5%;
  aspect-ratio: 16/9;
  border-radius: 10px;
  background: rgba(255,255,255,0.06);
  border: 2px solid transparent;
  display: flex; align-items: flex-end;
  padding: 0; cursor: pointer;
  transition: transform 0.22s cubic-bezier(0.25,0.46,0.45,0.94),
              border-color 0.18s, box-shadow 0.22s, filter 0.22s;
  position: relative; overflow: hidden;
  filter: brightness(0.72);
  transform-origin: bottom center;
}
.rail-card:focus, .rail-card.focused {
  outline: none;
  border-color: #C9A84C;
  transform: scale(1.07) translateY(-3%);
  z-index: 5;
  filter: brightness(1.0);
  box-shadow:
    0 12px 40px rgba(0,0,0,0.7),
    0 0 0 1px rgba(201,168,76,0.4),
    0 0 24px rgba(201,168,76,0.15);
}
.rail-card-label {
  color: #fff;
  font-size: 0.78em; font-weight: 700; line-height: 1.2;
  position: relative; z-index: 2;
  padding: 5% 7% 6%; width: 100%;
  text-shadow: 0 1px 8px rgba(0,0,0,0.95);
  opacity: 0.65; transition: opacity 0.2s;
}
.rail-card.focused .rail-card-label,
.rail-card:focus .rail-card-label { opacity: 1; }
.rail-card-bg {
  position: absolute; inset: 0;
  background: var(--card-bg, rgba(255,255,255,0.05));
}
.rail-card-img {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover; display: block;
}
.rail-card-gradient {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 55%;
  background: linear-gradient(to top, rgba(0,0,0,0.88) 0%, transparent 100%);
  z-index: 1;
}

/* Nav */
.home-nav {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  display: flex; align-items: center;
  justify-content: center; gap: 5%;
  padding: 0 3.5% 0.8%;
  z-index: 15;
}
.nav-item {
  color: rgba(255,255,255,0.35);
  font-size: 0.62em; font-weight: 600;
  letter-spacing: 0.06em; text-transform: uppercase;
  cursor: pointer; padding: 0.6% 0 0.5%;
  border-bottom: 1.5px solid transparent;
  transition: color 0.15s, border-color 0.15s;
  white-space: nowrap;
}
.nav-item.active { color: #fff; border-bottom-color: #C9A84C; }
.nav-item:focus { outline: none; color: #C9A84C; border-bottom-color: #C9A84C; }

/* ── Riri achievement views (preserved) ── */
#view-riri-intro { background: #000; }
#view-congrats {
  background: radial-gradient(ellipse at 60% 40%, rgba(201,168,76,0.12) 0%, #080d08 60%);
  align-items: center; justify-content: center; flex-direction: column;
}
@keyframes twinkle {
  0%, 100% { opacity: 0.2; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.8); }
}
</style>
</head>
<body>

<div id="boot">
  <img src="https://olatoyefamily.com/logo.jpg"
       style="width:64px;height:64px;border-radius:14px;object-fit:cover;opacity:0.6;"
       onerror="this.style.display='none'" alt="">
</div>

<div id="app">
  <div id="view-pairing" class="view"></div>
  <div id="view-riri-intro" class="view"></div>
  <div id="view-congrats"   class="view"></div>

  <!-- V2 Home — structure only, content injected by surface.js -->
  <div id="view-home" class="view">

    <!-- Full-bleed hero -->
    <div class="home-hero" id="home-hero">
      <div class="home-hero-bg"      id="home-hero-bg"></div>
      <div class="home-hero-gradient"></div>
      <div class="home-hero-text">
        <div class="hero-context" id="hero-context"></div>
        <div class="hero-heading" id="hero-heading"></div>
        <div class="hero-meta"    id="hero-meta"></div>
      </div>
    </div>

    <!-- Top chrome -->
    <div class="home-header">
      <div class="home-identity">
        <div class="home-icon">⌂</div>
        <div class="home-identity-text">
          <div class="home-nav-label" id="home-nav-label">Home</div>
          <div class="home-wordmark">Olatoye Family OS</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:0.8em;">
        <div class="home-status" id="home-realtime-status">
          <div class="home-status-dot offline" id="realtime-dot"></div>
          <div class="home-status-text" id="realtime-label">Connecting...</div>
        </div>
        <div class="home-clock" id="home-clock"></div>
      </div>
    </div>

    <!-- Content rail -->
    <div class="home-rails">
      <div class="rail-label" id="rail-label">Up Next</div>
      <div class="rail-cards" id="rail-cards"></div>
    </div>

    <!-- Five-destination nav -->
    <div class="home-nav">
      <div class="nav-item active" tabindex="0">Home</div>
      <div class="nav-item" tabindex="0">Academy</div>
      <div class="nav-item" tabindex="0">Watch</div>
      <div class="nav-item" tabindex="0">Memories</div>
      <div class="nav-item" tabindex="0">Family</div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/hub/surface.js"></script>
</body>
</html>
