<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Family OS</title>
<style>
/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%;
  background: #060a06;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  overflow: hidden;
  font-size: 16px; /* base — all em/% relative to this */
}

/* ── Boot ── */
#boot {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: #060a06; z-index: 9999;
  transition: opacity 0.6s ease;
}
#boot.fade-out { opacity: 0; pointer-events: none; }

/* ── App shell ── */
#app { position: fixed; inset: 0; display: none; }
#app.active { display: block; }
.view { position: absolute; inset: 0; display: none; }
.view.active { display: block; }

/* ══════════════════════════════════════════════════════
   HOME VIEW — explicit TV-safe vertical zones
   
   Viewport: 1920×1080 (100vw × 100vh)
   
   Zone layout (% of viewport height):
   ┌─────────────────────────────┐  0%
   │  Top chrome        6vh      │
   ├─────────────────────────────┤  6vh
   │  Hero copy         30vh     │  (context + heading + meta)
   ├─────────────────────────────┤  36vh
   │  Spacer                     │  fills remaining space
   ├─────────────────────────────┤  ~55vh
   │  Rail label        4vh      │
   │  Card rail         ~22vh    │  (16:9 cards at 26.5vw = ~15vh + padding)
   ├─────────────────────────────┤  ~81vh
   │  Nav               7vh      │
   └─────────────────────────────┘  88vh (12vh safe area at bottom)
   
   Hero artwork fills 100% behind all zones via inset:0
══════════════════════════════════════════════════════ */

#view-home { background: #060a06; }

/* Hero — full-bleed background layer */
.home-hero-bg {
  position: absolute; inset: 0;
  background-image: url(https://olatoyefamily.com/hub/assets/heroes/hero-morning-academy.png);
  background-size: cover;
  background-position: center top;
  background-repeat: no-repeat;
}

/* Gradient over hero — left darken + strong bottom fade */
.home-hero-gradient {
  position: absolute; inset: 0;
  background:
    linear-gradient(to right,
      rgba(0,0,0,0.65) 0%,
      rgba(0,0,0,0.2)  45%,
      transparent      70%),
    linear-gradient(to top,
      #060a06           0%,
      rgba(6,10,6,0.97) 20%,
      rgba(6,10,6,0.82) 34%,
      rgba(6,10,6,0.35) 55%,
      transparent       75%);
}

/* Top chrome — zone 1 */
.home-header {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 6vh;
  padding: 0 3.5%;
  display: flex; align-items: center; justify-content: space-between;
  z-index: 20;
}
.home-identity { display: flex; align-items: center; gap: 0.5em; }
.home-icon { color: #C9A84C; font-size: 0.9em; }
.home-wordmark { color: #C9A84C; font-size: 0.6em; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
.home-status {
  display: flex; align-items: center; gap: 0.4em;
  background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px; padding: 0.4% 1%;
}
.home-status-dot { width: 0.45em; height: 0.45em; border-radius: 50%; background: #30d158; }
.home-status-text { color: rgba(255,255,255,0.6); font-size: 0.5em; }
.home-clock { color: rgba(255,255,255,0.45); font-size: 0.5em; font-variant-numeric: tabular-nums; padding-left: 0.8em; border-left: 1px solid rgba(255,255,255,0.15); }

/* Hero copy — zone 2, sits at top-left */
.home-hero-text {
  position: absolute;
  top: 6vh; left: 3.5%;
  width: 50%;
  z-index: 10;
  padding-top: 3vh;
}
.hero-context { color: #C9A84C; font-size: 0.6em; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 0.6%; }
.hero-heading { color: #fff; font-size: 2.8em; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; margin-bottom: 1%; text-shadow: 0 2px 20px rgba(0,0,0,0.5); }
.hero-meta { color: rgba(255,255,255,0.45); font-size: 0.7em; }

/* Rail — zone 3, fixed distance from bottom */
.home-rails {
  position: absolute;
  bottom: 8vh;   /* above nav, with headroom for scaled card */
  left: 0; right: 0;
  padding: 0 3.5% 2%;
  z-index: 10;
  overflow: visible;
}
.rail-label {
  color: rgba(255,255,255,0.45);
  font-size: 0.55em; font-weight: 700;
  letter-spacing: 0.1em; text-transform: uppercase;
  margin-bottom: 0.8%;
}

/* Cards */
.rail-cards {
  display: flex; gap: 1.4%;
  overflow-x: auto;
  overflow-y: visible;
  padding-top: 3%;      /* room for focused card to grow upward */
  scrollbar-width: none;
  -ms-overflow-style: none;
}
.rail-cards::-webkit-scrollbar { display: none; }
.rail-card {
  flex: 0 0 26.5%;
  aspect-ratio: 16/9;
  border-radius: 10px;
  background: rgba(201,168,76,0.08);
  border: 2px solid transparent;
  display: flex; align-items: flex-end;
  position: relative; overflow: hidden;
  filter: brightness(0.72);
  transform-origin: bottom center;
  transition: transform 0.22s cubic-bezier(0.25,0.46,0.45,0.94),
              filter 0.22s, border-color 0.18s, box-shadow 0.22s;
  cursor: pointer;
  outline: none;
  flex-shrink: 0;
}
.rail-card.focused {
  border-color: #C9A84C;
  transform: scale(1.07) translateY(-3%);
  z-index: 5;
  filter: brightness(1.0);
  box-shadow: 0 12px 40px rgba(0,0,0,0.7), 0 0 0 1px rgba(201,168,76,0.4), 0 0 24px rgba(201,168,76,0.15);
}
.rail-card-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.rail-card-gradient { position: absolute; bottom: 0; left: 0; right: 0; height: 55%; background: linear-gradient(to top, rgba(0,0,0,0.88) 0%, transparent 100%); z-index: 1; }
.rail-card-label { color: #fff; font-size: 0.75em; font-weight: 700; line-height: 1.2; position: relative; z-index: 2; padding: 5% 7% 6%; width: 100%; text-shadow: 0 1px 8px rgba(0,0,0,0.95); opacity: 0.65; transition: opacity 0.2s; }
.rail-card.focused .rail-card-label { opacity: 1; }

/* Nav — zone 4, pinned to bottom */
.home-nav {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 7vh;
  display: flex; align-items: center; justify-content: center; gap: 5%;
  z-index: 15;
}
.nav-item {
  color: rgba(255,255,255,0.35);
  font-size: 0.6em; font-weight: 600;
  letter-spacing: 0.06em; text-transform: uppercase;
  padding: 0.6% 0;
  border-bottom: 1.5px solid transparent;
  transition: color 0.15s, border-color 0.15s;
  white-space: nowrap; outline: none;
  cursor: pointer;
}
.nav-item.active { color: #fff; border-bottom-color: #C9A84C; }
.nav-item.focused { color: #C9A84C; border-bottom-color: #C9A84C; }

/* Probe (diagnostic — remove later) */
#fos-probe {
  position: fixed; left: 12px; bottom: 12px; z-index: 10000;
  background: rgba(0,0,0,0.85); color: #0f0; padding: 6px 10px;
  font: 11px monospace; border-radius: 4px; pointer-events: none;
}
</style>
</head>
<body>

<div id="boot">
  <img src="https://olatoyefamily.com/logo.jpg"
       style="width:64px;height:64px;border-radius:14px;object-fit:cover;opacity:0.6;"
       onerror="this.style.display='none'" alt="">
</div>

<div id="app">
  <div id="view-home" class="view">

    <!-- Full-bleed hero background -->
    <div class="home-hero-bg" id="home-hero-bg"></div>
    <div class="home-hero-gradient"></div>

    <!-- Top chrome -->
    <div class="home-header">
      <div class="home-identity">
        <div class="home-icon">⌂</div>
        <div class="home-wordmark">Olatoye Family OS</div>
      </div>
      <div style="display:flex;align-items:center;gap:0.8em;">
        <div class="home-status">
          <div class="home-status-dot" id="realtime-dot"></div>
          <div class="home-status-text" id="realtime-label">Family OS</div>
        </div>
        <div class="home-clock" id="home-clock"></div>
      </div>
    </div>

    <!-- Hero copy -->
    <div class="home-hero-text">
      <div class="hero-context" id="hero-context">Good morning, Olatoye Family</div>
      <div class="hero-heading" id="hero-heading">Welcome home.</div>
      <div class="hero-meta" id="hero-meta"></div>
    </div>

    <!-- Card rail -->
    <div class="home-rails">
      <div class="rail-label" id="rail-label">Up Next</div>
      <div class="rail-cards" id="rail-cards"></div>
    </div>

    <!-- Navigation -->
    <div class="home-nav" id="home-nav">
      <div class="nav-item active focused" data-nav="home">Home</div>
      <div class="nav-item" data-nav="academy">Academy</div>
      <div class="nav-item" data-nav="watch">Watch</div>
      <div class="nav-item" data-nav="memories">Memories</div>
      <div class="nav-item" data-nav="family">Family</div>
    </div>

  </div>
</div>

<!-- Diagnostic probe -->
<div id="fos-probe">boot</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/hub/surface.js?v=emma16"></script>
</body>
</html>
