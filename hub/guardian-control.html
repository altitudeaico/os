<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Guardian — Control</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #F2F2F7; --card: #FFFFFF; --border: rgba(60,60,67,0.12);
    --text: #1C1C1E; --text-2: #8A8A8E; --gold: #B8863B;
    --green: #22A559; --red: #E5484D;
    --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 10px 24px -10px rgba(0,0,0,0.14);
    padding-top: env(safe-area-inset-top,0); padding-bottom: env(safe-area-inset-bottom,0);
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 24px 18px 48px; }
  .wrap { max-width: 560px; margin: 0 auto; }
  .backlink { display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:var(--text-2);
    font-weight:600;font-size:13px;background:var(--card);border:1px solid var(--border);
    border-radius:20px;padding:8px 14px;margin-bottom:16px; }
  h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 4px; }
  .sub { color: var(--text-2); font-size: 13px; margin-bottom: 20px; }
  .sec-label { font-size: 13px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-2); margin: 26px 2px 12px; }
  .sec-label:first-of-type { margin-top: 0; }
  .empty { color: var(--text-2); font-size: 13px; text-align: center; padding: 18px; background: var(--card); border-radius: 14px; border: 1px solid var(--border); }

  .req-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 10px; box-shadow: var(--shadow); }
  .req-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .req-child { font-weight: 800; font-size: 15px; }
  .req-when { font-size: 11px; color: var(--text-2); }
  .req-what { font-size: 16px; font-weight: 700; margin-top: 4px; }
  .req-type { font-size: 12px; color: var(--text-2); margin-top: 2px; }
  .req-actions { display: flex; gap: 8px; margin-top: 12px; }
  .req-btn { flex: 1; border: none; border-radius: 12px; padding: 10px; font-weight: 700; font-size: 14px; cursor: pointer; }
  .req-btn.approve { background: rgba(34,165,89,0.14); color: var(--green); }
  .req-btn.deny { background: rgba(229,72,77,0.12); color: var(--red); }
  .req-btn:active { filter: brightness(0.95); }

  .dec-item { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; margin-bottom: 7px; font-size: 13px; box-shadow: var(--shadow); }
  .dec-action { font-weight: 700; }
  .dec-when { color: var(--text-2); font-size: 11px; margin-top: 2px; }

  .auth-gate { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 22px; text-align: center; box-shadow: var(--shadow); }
  .auth-gate a { color: var(--gold); font-weight: 700; text-decoration: none; }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: var(--text); color: #fff; padding: 10px 18px; border-radius: 20px; font-size: 13px; font-weight: 600; opacity: 0; transition: all 0.25s; pointer-events: none; z-index: 99; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="wrap">
  <a class="backlink" href="/hub/control.html">← Central Control</a>
  <h1>🛡️ Guardian</h1>
  <div class="sub">Requests from Elsie and Emma, and the decisions that get made.</div>

  <div id="signed-out" style="display:none;" class="auth-gate">
    Sign in first via <a href="/control/">Central Control → TV Now</a>, then come back here — this page shares that sign-in.
  </div>

  <div id="signed-in" style="display:none;">
    <div class="sec-label">Needs you</div>
    <div id="needs-you"><div class="empty">Loading…</div></div>

    <div class="sec-label">Recent decisions</div>
    <div id="recent-decisions"><div class="empty">Loading…</div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = 'https://fypwabbhxnnwcpfjwrda.supabase.co';
const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ5cHdhYmJoeG5ud2NwZmp3cmRhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1NDg3ODUsImV4cCI6MjEwNDEyNDc4NX0.BwzgTd8_-lxENXnTu9ukxnHsgh3diguZbJPnzzC7XD4';

// Same storageKey as control/index.html so a session signed in there is
// already recognised here — no separate OAuth redirect to configure.
const sb = supabase.createClient(SUPABASE_URL, ANON_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, storageKey: 'family-os-hub-controller', storage: window.localStorage, flowType: 'implicit' }
});

let _session = null;
let capMap = {}, modeMap = {};

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(function () { el.classList.remove('show'); }, 3200);
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function timeAgo(iso) {
  const mins = Math.max(1, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
  if (mins < 60) return mins + 'm ago';
  const hrs = Math.round(mins / 60);
  if (hrs < 24) return hrs + 'h ago';
  return Math.round(hrs / 24) + 'd ago';
}
function childName(id) { return id ? id.charAt(0).toUpperCase() + id.slice(1) : 'Someone'; }
function itemLabel(req) {
  if (req.request_type === 'CAPABILITY') return capMap[req.requested_item] || req.requested_item;
  if (req.request_type === 'MODE_CHANGE') return (modeMap[req.requested_item] || req.requested_item) + ' mode';
  return req.requested_item;
}

async function loadLookups() {
  const [caps, modes] = await Promise.all([
    sb.from('guardian_capabilities').select('id,name'),
    sb.from('guardian_modes').select('id,name')
  ]);
  (caps.data || []).forEach(function (c) { capMap[c.id] = c.name; });
  (modes.data || []).forEach(function (m) { modeMap[m.id] = m.name; });
}

async function loadNeedsYou() {
  const el = document.getElementById('needs-you');
  const { data, error } = await sb.from('guardian_access_requests').select('*').eq('status', 'pending').order('requested_at', { ascending: false });
  if (error) { el.innerHTML = '<div class="empty">Could not load: ' + esc(error.message) + '</div>'; return; }
  if (!data.length) { el.innerHTML = '<div class="empty">Nothing waiting — all clear.</div>'; return; }
  el.innerHTML = data.map(function (r) {
    return '<div class="req-card">' +
      '<div class="req-top"><div class="req-child">' + esc(childName(r.child_id)) + '</div><div class="req-when">' + timeAgo(r.requested_at) + '</div></div>' +
      '<div class="req-what">' + esc(itemLabel(r)) + '</div>' +
      '<div class="req-type">' + esc(r.request_type === 'CAPABILITY' ? 'Wants to use this' : 'Wants to switch mode') + (r.reason ? ' · "' + esc(r.reason) + '"' : '') + '</div>' +
      '<div class="req-actions">' +
        '<button class="req-btn deny" onclick="decide(\'' + r.id + '\',false)">Not now</button>' +
        '<button class="req-btn approve" onclick="decide(\'' + r.id + '\',true)">Approve</button>' +
      '</div></div>';
  }).join('');
}

async function loadRecentDecisions() {
  const el = document.getElementById('recent-decisions');
  const { data, error } = await sb.from('family_audit_events').select('action,child_ids,reason,occurred_at,metadata').eq('domain', 'guardian').order('occurred_at', { ascending: false }).limit(10);
  if (error) { el.innerHTML = '<div class="empty">Could not load: ' + esc(error.message) + '</div>'; return; }
  if (!data.length) { el.innerHTML = '<div class="empty">No Guardian decisions yet.</div>'; return; }
  el.innerHTML = data.map(function (a) {
    const who = (a.child_ids && a.child_ids.length) ? a.child_ids.map(childName).join(', ') : '';
    return '<div class="dec-item"><div class="dec-action">' + esc(a.action.replace(/_/g, ' ')) + (who ? ' — ' + esc(who) : '') + '</div>' +
      '<div class="dec-when">' + timeAgo(a.occurred_at) + '</div></div>';
  }).join('');
}

async function decide(accessRequestId, approve) {
  if (!_session) { showToast('Not signed in'); return; }
  try {
    const r = await fetch(SUPABASE_URL + '/functions/v1/guardian', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + _session.access_token, apikey: ANON_KEY },
      body: JSON.stringify({ operation: approve ? 'approve_request' : 'deny_request', payload: { access_request_id: accessRequestId, duration: 'once' } })
    });
    const body = await r.json();
    if (!r.ok || !body.ok) { showToast('Failed: ' + (body.error || body.reason || r.status)); return; }
    showToast(approve ? 'Approved' : 'Denied');
    loadNeedsYou();
    loadRecentDecisions();
  } catch (e) {
    showToast('Failed: ' + e.message);
  }
}

async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  _session = session;
  if (!session) {
    document.getElementById('signed-out').style.display = 'block';
    return;
  }
  document.getElementById('signed-in').style.display = 'block';
  await loadLookups();
  loadNeedsYou();
  loadRecentDecisions();
}
boot();
</script>
</body>
</html>
