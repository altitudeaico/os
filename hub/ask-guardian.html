<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Ask Guardian</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #F2F2F7; --card: #FFFFFF; --border: rgba(60,60,67,0.12);
    --text: #1C1C1E; --text-2: #8A8A8E;
    --elsie: #8B5CF6; --emma: #EC4899;
    --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 10px 24px -10px rgba(0,0,0,0.14);
    padding-top: env(safe-area-inset-top,0); padding-bottom: env(safe-area-inset-bottom,0);
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 24px 18px 40px; }
  .wrap { max-width: 480px; margin: 0 auto; }
  .head { text-align: center; margin-bottom: 24px; }
  .head-title { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
  .head-sub { color: var(--text-2); font-size: 14px; margin-top: 4px; }

  /* Who's asking */
  .who-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 20px; }
  .who-btn { border: none; border-radius: 22px; padding: 34px 16px; font-size: 20px; font-weight: 800; color: #fff; box-shadow: var(--shadow); cursor: pointer; }
  .who-btn.elsie { background: linear-gradient(135deg, #A78BFA, #7C3AED); }
  .who-btn.emma  { background: linear-gradient(135deg, #F472B6, #DB2777); }

  .backrow { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .backbtn { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 8px 14px; font-size: 13px; font-weight: 600; color: var(--text); cursor: pointer; }
  .whoami { font-weight: 800; font-size: 18px; }

  .cap-list { display: flex; flex-direction: column; gap: 10px; }
  .cap-tile { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 14px 16px; box-shadow: var(--shadow); cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .cap-tile:active { transform: scale(0.98); }
  .cap-name { font-weight: 600; font-size: 15px; }
  .cap-domain { color: var(--text-2); font-size: 12px; margin-top: 2px; }
  .cap-badge { font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: 20px; white-space: nowrap; }
  .badge-allow { background: rgba(34,165,89,0.14); color: #1e8e4f; }
  .badge-ask   { background: rgba(184,134,59,0.14); color: #96702c; }
  .badge-no    { background: rgba(60,60,67,0.08); color: var(--text-2); }

  .sec-label { font-size: 13px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-2); margin: 26px 2px 12px; }

  .result-overlay { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,0.45); display: none; align-items: center; justify-content: center; padding: 20px; }
  .result-card { background: var(--card); border-radius: 22px; padding: 28px 24px; max-width: 340px; width: 100%; text-align: center; box-shadow: var(--shadow); }
  .result-emoji { font-size: 40px; margin-bottom: 10px; }
  .result-msg { font-size: 18px; font-weight: 700; line-height: 1.3; }
  .result-close { margin-top: 18px; background: var(--text); color: #fff; border: none; border-radius: 20px; padding: 10px 22px; font-weight: 700; font-size: 14px; cursor: pointer; }

  .req-item { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 10px; box-shadow: var(--shadow); }
  .req-name { font-size: 14px; font-weight: 600; }
  .req-when { font-size: 11px; color: var(--text-2); }
  .empty { color: var(--text-2); font-size: 13px; text-align: center; padding: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="head-title">🛡️ Ask Guardian</div>
    <div class="head-sub">Check what you can do, or ask</div>
  </div>

  <div id="who-screen">
    <div class="who-grid">
      <button class="who-btn elsie" onclick="chooseChild('elsie','Elsie')">Elsie</button>
      <button class="who-btn emma" onclick="chooseChild('emma','Emma')">Emma</button>
    </div>
  </div>

  <div id="ask-screen" style="display:none;">
    <div class="backrow">
      <button class="backbtn" onclick="backToWho()">← Switch</button>
      <div class="whoami" id="whoami-label"></div>
    </div>
    <div class="sec-label">Things you can ask about</div>
    <div class="cap-list" id="cap-list"></div>
    <div class="sec-label">Your recent asks</div>
    <div id="recent-list"></div>
  </div>
</div>

<div class="result-overlay" id="result-overlay">
  <div class="result-card">
    <div class="result-emoji" id="result-emoji">🎉</div>
    <div class="result-msg" id="result-msg"></div>
    <button class="result-close" onclick="closeResult()">OK</button>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://fypwabbhxnnwcpfjwrda.supabase.co';
const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ5cHdhYmJoeG5ud2NwZmp3cmRhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1NDg3ODUsImV4cCI6MjEwNDEyNDc4NX0.BwzgTd8_-lxENXnTu9ukxnHsgh3diguZbJPnzzC7XD4';
const H = { apikey: ANON_KEY, Authorization: 'Bearer ' + ANON_KEY };

let currentChild = null, currentChildLabel = null;
let capsCache = null;

async function api(path) {
  const r = await fetch(SUPABASE_URL + '/rest/v1/' + path, { headers: H });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
async function apiInsert(table, row) {
  const r = await fetch(SUPABASE_URL + '/rest/v1/' + table, {
    method: 'POST',
    headers: Object.assign({}, H, { 'Content-Type': 'application/json', Prefer: 'return=minimal' }),
    body: JSON.stringify(row)
  });
  if (!r.ok) throw new Error(await r.text());
}

function chooseChild(id, label) {
  currentChild = id; currentChildLabel = label;
  document.getElementById('who-screen').style.display = 'none';
  document.getElementById('ask-screen').style.display = 'block';
  document.getElementById('whoami-label').textContent = label;
  loadCapabilities();
  loadRecent();
}
function backToWho() {
  currentChild = null;
  document.getElementById('ask-screen').style.display = 'none';
  document.getElementById('who-screen').style.display = 'block';
}

async function loadCapabilities() {
  const list = document.getElementById('cap-list');
  list.innerHTML = '<div class="empty">Loading…</div>';
  try {
    if (!capsCache) capsCache = await api('guardian_capabilities?select=id,domain,name&order=domain');
    const caps = capsCache.filter(function (c) { return c.domain !== 'System'; });
    list.innerHTML = caps.map(function (c) {
      return '<div class="cap-tile" onclick="askAbout(\'' + c.id + '\',\'' + esc(c.name) + '\')">' +
        '<div><div class="cap-name">' + esc(c.name) + '</div><div class="cap-domain">' + esc(c.domain) + '</div></div>' +
        '<div class="cap-badge badge-ask">Ask</div></div>';
    }).join('');
  } catch (e) {
    list.innerHTML = '<div class="empty">Could not load — check connection.</div>';
  }
}

async function askAbout(capId, capName) {
  try {
    const perms = await api('guardian_child_permissions?child_id=eq.' + currentChild + '&capability=eq.' + capId + '&active=eq.true&select=effect');
    const perm = perms[0];

    if (!perm) {
      showResult('🚫', capName + ' isn\'t available yet.');
      return;
    }
    if (perm.effect === 'allow') {
      showResult('✅', 'You can already do this!\n' + capName);
      return;
    }

    // effect === 'deny' — check for an existing pending or active-approved request
    const existing = await api('guardian_access_requests?child_id=eq.' + currentChild + '&requested_item=eq.' + capId + '&request_type=eq.CAPABILITY&order=requested_at.desc&limit=1');
    const last = existing[0];
    const now = new Date();
    if (last && last.status === 'pending') {
      showResult('⏳', 'You already asked about ' + capName + ' — waiting for an answer.');
      loadRecent();
      return;
    }
    if (last && (last.status === 'approved_once' || last.status === 'approved_permanent') && (!last.expires_at || new Date(last.expires_at) > now)) {
      showResult('✅', 'Yes — approved!\n' + capName);
      return;
    }

    await apiInsert('guardian_access_requests', {
      child_id: currentChild, request_type: 'CAPABILITY', requested_item: capId, status: 'pending'
    });
    showResult('🙋', 'Asked! We\'ll let you know.\n' + capName);
    loadRecent();
  } catch (e) {
    showResult('⚠️', 'Something went wrong — try again.');
  }
}

async function loadRecent() {
  const el = document.getElementById('recent-list');
  el.innerHTML = '<div class="empty">Loading…</div>';
  try {
    const rows = await api('guardian_access_requests?child_id=eq.' + currentChild + '&request_type=eq.CAPABILITY&order=requested_at.desc&limit=6');
    if (!rows.length) { el.innerHTML = '<div class="empty">Nothing asked yet.</div>'; return; }
    const capMap = {}; (capsCache || []).forEach(function (c) { capMap[c.id] = c.name; });
    el.innerHTML = rows.map(function (r) {
      const label = statusLabel(r.status);
      const name = capMap[r.requested_item] || r.requested_item;
      return '<div class="req-item"><div><div class="req-name">' + esc(name) + '</div><div class="req-when">' + timeAgo(r.requested_at) + '</div></div>' +
        '<div class="cap-badge ' + label.cls + '">' + label.text + '</div></div>';
    }).join('');
  } catch (e) {
    el.innerHTML = '<div class="empty">Could not load.</div>';
  }
}

function statusLabel(s) {
  if (s === 'pending') return { text: 'Waiting', cls: 'badge-ask' };
  if (s === 'approved_once' || s === 'approved_permanent') return { text: 'Yes!', cls: 'badge-allow' };
  if (s === 'denied') return { text: 'Not this time', cls: 'badge-no' };
  return { text: s, cls: 'badge-no' };
}
function timeAgo(iso) {
  const mins = Math.max(1, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
  if (mins < 60) return mins + 'm ago';
  const hrs = Math.round(mins / 60);
  if (hrs < 24) return hrs + 'h ago';
  return Math.round(hrs / 24) + 'd ago';
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

function showResult(emoji, msg) {
  document.getElementById('result-emoji').textContent = emoji;
  document.getElementById('result-msg').textContent = msg;
  document.getElementById('result-overlay').style.display = 'flex';
}
function closeResult() { document.getElementById('result-overlay').style.display = 'none'; }
</script>
</body>
</html>
