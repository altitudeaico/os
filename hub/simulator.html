<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Family OS — TV Simulator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0b0b0d; color: #fff; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; padding: 20px 16px 40px;
  }
  .head { text-align: center; margin-bottom: 16px; }
  .head-title { font-size: 18px; font-weight: 700; }
  .head-sub { color: rgba(255,255,255,0.5); font-size: 12px; margin-top: 2px; }
  .head-sub a { color: #C9A84C; }

  .tv-frame {
    width: 100%; max-width: 1040px; aspect-ratio: 16 / 9;
    background: #000; border-radius: 14px; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.08);
  }
  .tv-frame iframe { width: 100%; height: 100%; border: none; }

  .toolbar { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; justify-content: center; }
  .tb-btn {
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14);
    color: #fff; border-radius: 20px; padding: 8px 16px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .tb-btn:active { background: rgba(255,255,255,0.16); }

  .dpad-wrap { display: flex; align-items: center; gap: 28px; margin-top: 22px; }
  .dpad { position: relative; width: 148px; height: 148px; }
  .dpad-btn {
    position: absolute; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.16);
    color: #fff; border-radius: 12px; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .dpad-btn:active { background: rgba(201,168,76,0.35); }
  .dpad-up    { top: 0;    left: 50px; width: 48px; height: 48px; }
  .dpad-down  { bottom: 0; left: 50px; width: 48px; height: 48px; }
  .dpad-left  { top: 50px; left: 0;    width: 48px; height: 48px; }
  .dpad-right { top: 50px; right: 0;   width: 48px; height: 48px; }
  .dpad-ok    { top: 50px; left: 50px; width: 48px; height: 48px; border-radius: 50%; background: rgba(201,168,76,0.25); border-color: rgba(201,168,76,0.5); font-size: 13px; font-weight: 800; }
  .backbtn-col { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .back-btn {
    width: 56px; height: 56px; border-radius: 50%; background: rgba(229,72,77,0.18); border: 1px solid rgba(229,72,77,0.4);
    color: #fff; font-size: 20px; cursor: pointer;
  }
  .back-label { font-size: 11px; color: rgba(255,255,255,0.5); }

  .hint { color: rgba(255,255,255,0.35); font-size: 12px; margin-top: 18px; text-align: center; max-width: 480px; }
</style>
</head>
<body>
  <div class="head">
    <div class="head-title">📺 TV Simulator</div>
    <div class="head-sub">The real, live Living Room TV app — not a mockup. Same code as <a href="https://olatoyefamily.com/hub/" target="_blank" rel="noopener">olatoyefamily.com/hub/</a></div>
  </div>

  <div class="tv-frame">
    <iframe id="tv-iframe" src="/hub/index.html" title="Family OS TV"></iframe>
  </div>

  <div class="toolbar">
    <button class="tb-btn" onclick="reloadTV()">↻ Reload (picks up latest push)</button>
    <button class="tb-btn" onclick="window.open('/hub/index.html','_blank')">⤢ Open full-size in new tab</button>
    <button class="tb-btn" onclick="window.open('/hub/control.html','_blank')">🎛 Open Central Control</button>
  </div>

  <div class="dpad-wrap">
    <div class="dpad">
      <button class="dpad-btn dpad-up"    onclick="sendKey('ArrowUp',38)">▲</button>
      <button class="dpad-btn dpad-left"  onclick="sendKey('ArrowLeft',37)">◀</button>
      <button class="dpad-btn dpad-ok"    onclick="sendKey('Enter',13)">OK</button>
      <button class="dpad-btn dpad-right" onclick="sendKey('ArrowRight',39)">▶</button>
      <button class="dpad-btn dpad-down"  onclick="sendKey('ArrowDown',40)">▼</button>
    </div>
    <div class="backbtn-col">
      <button class="back-btn" onclick="sendKey('Escape',27)">←</button>
      <div class="back-label">Back</div>
    </div>
  </div>

  <div class="hint">
    Click into the TV frame and your real keyboard's arrow keys, Enter and Escape work directly too — the app listens for them natively. The on-screen D-pad above is for mouse/touch-only testing.
  </div>

<script>
function tvWindow() {
  var f = document.getElementById('tv-iframe');
  return f && f.contentWindow;
}
function sendKey(key, keyCode) {
  var w = tvWindow();
  if (!w) return;
  try {
    var evt = new KeyboardEvent('keydown', { key: key, keyCode: keyCode, which: keyCode, bubbles: true, cancelable: true });
    w.document.dispatchEvent(evt);
  } catch (e) { /* cross-origin or not-yet-loaded — ignore */ }
}
function reloadTV() {
  var f = document.getElementById('tv-iframe');
  f.src = '/hub/index.html?t=' + Date.now();
}
</script>
</body>
</html>
