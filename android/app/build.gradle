plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

// Fixed signing identity for the TV app, supplied by the build workflow from
// GitHub secrets (never stored in the repo). With it, every new APK installs
// over the old one in place. Local builds without it fall back to the default
// debug key.
def tvStoreFile = System.getenv('TV_SIGNING_STORE_FILE')

android {
    namespace 'com.olatoyefamily.familyos'
    compileSdk 34

    defaultConfig {
        applicationId "com.olatoyefamily.familyos"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "0.2.0-media"
    }

    signingConfigs {
        if (tvStoreFile) {
            familyos {
                storeFile file(tvStoreFile)
                storeType 'pkcs12'
                storePassword System.getenv('TV_SIGNING_STORE_PASSWORD')
                keyAlias System.getenv('TV_SIGNING_KEY_ALIAS')
                keyPassword System.getenv('TV_SIGNING_KEY_PASSWORD')
            }
        }
    }

    buildFeatures {
        buildConfig true  // Required for BuildConfig.DEBUG in AGP 8.x
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            if (tvStoreFile) signingConfig signingConfigs.familyos
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.leanback:leanback:1.0.0'
}
