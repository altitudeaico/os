plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.olatoyefamily.familyos'
    compileSdk 34

    defaultConfig {
        applicationId "com.olatoyefamily.familyos"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "0.2.0-ztp"
        // Surface provisioning grant — injected from CI secret, never from gradle.properties
        buildConfigField "String", "SURFACE_PROVISIONING_GRANT",
            "\"${project.findProperty('SURFACE_PROVISIONING_GRANT') ?: ''}\"" 
    }

    buildFeatures {
        buildConfig true  // Required for BuildConfig.DEBUG in AGP 8.x
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.leanback:leanback:1.0.0'
}
