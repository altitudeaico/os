<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Olatoye Family</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  height: 100%;
  background: #080d08;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
.wrap {
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  padding: 40px 24px;
}
img {
  width: 80px;
  height: 80px;
  border-radius: 18px;
  object-fit: cover;
}
.name {
  color: #C9A84C;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
}
.tagline {
  color: rgba(255,255,255,0.85);
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -0.02em;
  line-height: 1.2;
}
.sub {
  color: rgba(255,255,255,0.3);
  font-size: 13px;
  letter-spacing: 0.04em;
}
</style>
</head>
<body>
<div class="wrap">
  <img src="/logo.jpg" alt="Olatoye Family">
  <div class="name">Olatoye Family</div>
  <div class="tagline">Private family system</div>
  <div class="sub">Authorised access only</div>
</div>
</body>
</html>
