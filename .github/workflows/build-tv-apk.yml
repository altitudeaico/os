# Family OS TV — Android Debug APK Build
#
# Builds the Family OS Android TV shell from source.
# Triggered manually only — no automatic deployments.
# No Supabase or Family OS secrets required — the APK contains no credentials.
# All Family OS configuration lives in the web client at olatoyefamily.com/hub/

name: Build Family OS TV APK

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for build (optional)'
        required: false
        default: 'Manual build'

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v2

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
        env:
          # No secrets needed — APK contains no credentials
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2g"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: family-os-tv-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
