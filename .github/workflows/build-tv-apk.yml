name: Build Family OS TV APK

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for build (optional)'
        required: false
        default: 'Manual build'

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build tools and platform
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v2

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Load Family OS signing key
        env:
          KEYSTORE_B64: ${{ secrets.TV_SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::TV_SIGNING_KEYSTORE_B64 secret is missing. Refusing to build an APK with a throwaway key."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/familyos-tv.p12"
          echo "TV_SIGNING_STORE_FILE=$RUNNER_TEMP/familyos-tv.p12" >> "$GITHUB_ENV"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2g"
          SURFACE_PROVISIONING_GRANT: ${{ secrets.SURFACE_PROVISIONING_GRANT }}
          TV_SIGNING_STORE_PASSWORD: ${{ secrets.TV_SIGNING_STORE_PASSWORD }}
          TV_SIGNING_KEY_ALIAS: ${{ secrets.TV_SIGNING_KEY_ALIAS }}
          TV_SIGNING_KEY_PASSWORD: ${{ secrets.TV_SIGNING_KEY_PASSWORD }}

      - name: Verify APK carries the Family OS signing key
        run: |
          CERT=$("$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep 'certificate SHA-256 digest' | head -1 | awk '{print $NF}')
          echo "Signed with SHA-256 $CERT"
          [ "$CERT" = "e36d0c4e5ef44659efcaa830af6ffd3fd9a125d53dff37eef130f9cb36969d9f" ] || { echo "::error::APK is not signed with the Family OS key"; exit 1; }
          rm -f "$RUNNER_TEMP/familyos-tv.p12"

      - name: Publish APK to downloads folder
        run: |
          mkdir -p downloads
          cp android/app/build/outputs/apk/debug/app-debug.apk downloads/family-os-tv.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add downloads/family-os-tv.apk
          git diff --staged --quiet || git commit -m "build: publish Family OS TV debug APK [skip ci]"
          git push

      - name: Upload debug APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: family-os-tv-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
