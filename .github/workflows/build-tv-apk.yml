name: Build Family OS TV APK

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for build (optional)'
        required: false
        default: 'Manual build'

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 9477386
          accept-android-sdk-licenses: true

      - name: Install Android build tools and platform
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v2

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace -PSURFACE_PROVISIONING_GRANT="${{ secrets.SURFACE_PROVISIONING_GRANT }}"
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2g"

      - name: Publish APK to downloads folder
        run: |
          mkdir -p downloads
          cp android/app/build/outputs/apk/debug/app-debug.apk downloads/family-os-tv.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add downloads/family-os-tv.apk
          git diff --staged --quiet || git commit -m "build: publish Family OS TV debug APK [skip ci]"
          git push

      - name: Upload debug APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: family-os-tv-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
